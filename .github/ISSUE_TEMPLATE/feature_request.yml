name: 功能建议
description: 建议已有平台、界面或任务功能改进
title: "[Feature] "
labels: ["enhancement", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        如果是新增平台，请使用“新平台接入建议 / 共创认领”模板。

        如果想认领这个 Issue，请直接在评论区回复“认领”，不需要在表单中填写认领计划。
  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认（可选）
      options:
        - label: 我已经搜索过已有 Issue 和 PR，暂时没有找到相同建议。
        - label: 这不是新增平台建议。
  - type: textarea
    id: description
    attributes:
      label: 功能建议
      description: 请说明想解决什么问题，以及希望万能导怎么改。
      placeholder: 例如：导出失败后，希望任务中心可以只重试失败的文档。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 示例、参考资料或截图（可选）
      description: 可以提供公开链接、截图或你期望的效果。

